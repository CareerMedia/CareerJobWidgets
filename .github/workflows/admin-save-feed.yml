name: Admin save feed

on:
  workflow_dispatch:
    inputs:
      action:
        description: "upsert or delete"
        required: true
        type: choice
        options:
          - upsert
          - delete
      feed_json:
        description: "Feed JSON (full feed for upsert, or { id } for delete)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: admin-save-feed
  # Latest admin save wins — cancels a stuck/queued prior attempt so retries aren't blocked.
  cancel-in-progress: true

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update feeds.sync.json
        run: node scripts/admin-update-feeds-sync.mjs
        env:
          ACTION: ${{ inputs.action }}
          FEED_JSON: ${{ inputs.feed_json }}

      - name: Sync feeds (server-side, no CORS)
        run: node scripts/sync-feeds.mjs
        env:
          HANDSHAKE_CSUN_AMC_FEED_URL: ${{ secrets.HANDSHAKE_CSUN_AMC_FEED_URL }}
          # Upsert: only re-fetch the saved feed; reuse existing cache for others.
          # Delete: rebuild manifest/config from existing cache files (no Handshake fetches).
          SYNC_FEED_ID: ${{ inputs.action == 'upsert' && fromJSON(inputs.feed_json).id || '' }}
          SKIP_FETCH: ${{ inputs.action == 'delete' && '1' || '' }}

      - name: Commit feed config and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.sync.json public/data/feeds/
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: admin feed save (${{ inputs.action }})"
            git push
          fi

      # GITHUB_TOKEN pushes do not trigger on:push workflows — dispatch Pages deploy explicitly.
      - name: Trigger Pages deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
